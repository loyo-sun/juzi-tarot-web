<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>橘子塔塔 - 管理后台</title>
  
  <!-- Element Plus CSS -->
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f0f2f5;
    }

    #app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 顶部导航栏 */
    .admin-header {
      background: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      z-index: 1000;
    }

    .logo {
      font-size: 20px;
      font-weight: 600;
      color: #ff6b35;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo span {
      font-size: 24px;
    }

    /* 主体容器 */
    .admin-container {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* 侧边栏 */
    .admin-sidebar {
      width: 200px;
      background: #fff;
      box-shadow: 2px 0 8px rgba(0, 0, 0, 0.08);
      overflow-y: auto;
    }

    .el-menu {
      border-right: none;
    }

    /* 主内容区 */
    .admin-main {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background: #f0f2f5;
    }

    .page-header {
      margin-bottom: 20px;
    }

    .page-title {
      font-size: 24px;
      font-weight: 600;
      color: #303133;
      margin-bottom: 10px;
    }

    .page-description {
      font-size: 14px;
      color: #909399;
    }

    /* 卡片样式 */
    .content-card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      padding: 20px;
    }

    /* 表单样式 */
    .form-card {
      max-width: 600px;
      margin: 0 auto;
    }

    /* 表格操作列 */
    .table-actions {
      display: flex;
      gap: 8px;
    }

    /* 状态标签 */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* 卡牌显示 */
    .card-display {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin: 20px 0;
    }

    .card-item {
      text-align: center;
    }

    .card-image {
      width: 120px;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      margin-bottom: 10px;
    }

    .card-name {
      font-size: 14px;
      color: #606266;
    }

    .card-reversed {
      color: #f56c6c;
      font-size: 12px;
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .admin-sidebar {
        width: 60px;
      }

      .logo-text {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- 顶部导航 -->
    <div class="admin-header">
      <div class="logo">
        <span>🍊</span>
        <span class="logo-text">橘子塔塔管理后台</span>
      </div>
      <el-dropdown @command="handleCommand">
        <span class="el-dropdown-link">
          <el-icon><el-icon-user /></el-icon>
          {{ adminInfo.name || adminInfo.email }}
          <el-icon class="el-icon--right"><el-icon-arrow-down /></el-icon>
        </span>
        <template #dropdown>
          <el-dropdown-menu>
            <el-dropdown-item command="logout">退出登录</el-dropdown-item>
          </el-dropdown-menu>
        </template>
      </el-dropdown>
    </div>

    <!-- 主体容器 -->
    <div class="admin-container">
      <!-- 侧边栏 -->
      <div class="admin-sidebar">
        <el-menu
          :default-active="activeMenu"
          @select="handleMenuSelect"
          :collapse="false"
        >
          <el-sub-menu index="codes">
            <template #title>
              <el-icon><el-icon-ticket /></el-icon>
              <span>兑换码管理</span>
            </template>
            <el-menu-item index="create-code">创建兑换码</el-menu-item>
            <el-menu-item index="manage-codes">兑换码管理</el-menu-item>
          </el-sub-menu>
          
          <el-menu-item index="sessions">
            <el-icon><el-icon-reading /></el-icon>
            <span>占卜记录</span>
          </el-menu-item>

          <el-menu-item index="stats">
            <el-icon><el-icon-data-analysis /></el-icon>
            <span>统计数据</span>
          </el-menu-item>
        </el-menu>
      </div>

      <!-- 主内容区 -->
      <div class="admin-main">
        <!-- 动态内容由 Vue 渲染 -->
        <component :is="currentComponent"></component>
      </div>
    </div>
  </div>

  <!-- Vue 3 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <!-- Element Plus -->
  <script src="https://unpkg.com/element-plus"></script>
  <!-- Element Plus Icons -->
  <script src="https://unpkg.com/@element-plus/icons-vue"></script>
  
  <!-- 应用脚本 -->
  <script src="./app.js"></script>
</body>
</html>
