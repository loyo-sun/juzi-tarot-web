<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 橘子塔罗管理后台</title>
  
  <!-- Element Plus CSS -->
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #app {
      width: 100%;
      max-width: 400px;
      padding: 20px;
    }

    .login-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      padding: 40px;
    }

    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .title {
      font-size: 24px;
      font-weight: 600;
      color: #303133;
      margin-bottom: 5px;
    }

    .subtitle {
      font-size: 14px;
      color: #909399;
    }

    .login-form {
      margin-top: 20px;
    }

    .login-button {
      width: 100%;
      margin-top: 10px;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      color: rgba(255, 255, 255, 0.8);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="login-card">
      <div class="login-header">
        <div class="logo">🍊</div>
        <h1 class="title">橘子塔罗</h1>
        <p class="subtitle">管理后台登录</p>
      </div>

      <el-form
        ref="formRef"
        :model="form"
        :rules="rules"
        class="login-form"
        @submit.prevent="handleLogin"
      >
        <el-form-item prop="email">
          <el-input
            v-model="form.email"
            placeholder="请输入邮箱"
            size="large"
            :prefix-icon="ElIconUser"
          />
        </el-form-item>

        <el-form-item prop="password">
          <el-input
            v-model="form.password"
            type="password"
            placeholder="请输入密码"
            size="large"
            :prefix-icon="ElIconLock"
            show-password
            @keyup.enter="handleLogin"
          />
        </el-form-item>

        <el-button
          type="primary"
          size="large"
          :loading="loading"
          @click="handleLogin"
          class="login-button"
        >
          登录
        </el-button>
      </el-form>
    </div>

    <div class="footer">
      © 2026 橘子塔罗 · 用科技连接心灵
    </div>
  </div>

  <!-- Vue 3 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <!-- Element Plus -->
  <script src="https://unpkg.com/element-plus"></script>
  <!-- Element Plus Icons -->
  <script src="https://unpkg.com/@element-plus/icons-vue"></script>
  
  <script>
    const { createApp, ref, reactive } = Vue;
    const { ElMessage } = ElementPlus;
    const { User: ElIconUser, Lock: ElIconLock } = ElementPlusIconsVue;

    const app = createApp({
      setup() {
        const formRef = ref(null);
        const loading = ref(false);
        
        const form = reactive({
          email: '',
          password: ''
        });

        const rules = {
          email: [
            { required: true, message: '请输入邮箱', trigger: 'blur' },
            { type: 'email', message: '请输入正确的邮箱格式', trigger: 'blur' }
          ],
          password: [
            { required: true, message: '请输入密码', trigger: 'blur' },
            { min: 6, message: '密码至少6个字符', trigger: 'blur' }
          ]
        };

        const handleLogin = async () => {
          if (!formRef.value) return;
          
          try {
            await formRef.value.validate();
            loading.value = true;

            const response = await fetch('/api/admin-auth?action=login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                email: form.email,
                password: form.password
              })
            });

            const data = await response.json();

            if (data.success) {
              localStorage.setItem('admin_token', data.token);
              ElMessage.success('登录成功');
              setTimeout(() => {
                window.location.href = '/admin-v2/index.html';
              }, 500);
            } else {
              ElMessage.error(data.error || '登录失败');
            }
          } catch (error) {
            if (error !== 'validate') {
              console.error('登录失败:', error);
              ElMessage.error('登录失败，请稍后重试');
            }
          } finally {
            loading.value = false;
          }
        };

        return {
          formRef,
          form,
          rules,
          loading,
          handleLogin,
          ElIconUser,
          ElIconLock
        };
      }
    });

    app.use(ElementPlus);
    app.mount('#app');
  </script>
</body>
</html>
